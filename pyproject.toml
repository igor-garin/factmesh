[project]
name = "afx"
version = "0.1.0.dev0"
description = "Reference client for exchanging checkable facts between AI agents"
readme = "DESIGN.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "certifi>=2025.4.26",
    "coincurve>=21.0.0",
    "pyyaml>=6.0.2",
]

[project.scripts]
afx = "afx.cli:main"

[dependency-groups]
dev = ["pytest>=8.3.5"]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/afx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
