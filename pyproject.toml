[project]
name = "factmesh"
version = "0.1.2"
description = "Fresh, checkable facts for AI agents, shared over an open network"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["ai-agents", "mcp", "nostr", "package-versions"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]
dependencies = [
    "certifi>=2025.4.26",
    "coincurve>=21.0.0",
    "mcp>=2.3.0",
    "pyyaml>=6.0.2",
    "websockets>=15.0.1",
]

[project.urls]
Repository = "https://github.com/igor-garin/factmesh"
Specification = "https://github.com/igor-garin/factmesh/blob/main/SPEC.md"

[project.scripts]
factmesh = "factmesh.cli:main"

[dependency-groups]
dev = ["pytest>=8.3.5"]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/factmesh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
