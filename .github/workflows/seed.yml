# Publishes "latest version" claims for seed/packages.toml every hour, so the
# network has facts before it has users. Needs the repository secret
# FACTMESH_SEED_KEY (64 hex characters); see docs/seeding.md.

name: Seed

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seed
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - name: Publish claims
        run: uv run --locked factmesh seed --key-env FACTMESH_SEED_KEY
        env:
          FACTMESH_SEED_KEY: ${{ secrets.FACTMESH_SEED_KEY }}
          FACTMESH_HOME: ${{ runner.temp }}/factmesh
